# Tracehound Indexer - Docker Compose Configuration
# 🐕 Complete development environment with all dependencies
#
# Usage:
#   docker-compose -f deployments/docker-compose.yml up -d
#
# Services:
#   - postgres: PostgreSQL database for storing whale scents
#   - zookeeper: Zookeeper for Kafka coordination
#   - kafka: Kafka for event streaming
#   - indexer: Tracehound Indexer service

version: '3.8'

services:
  # ============================================================================
  # PostgreSQL - Whale Scent Storage
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: tracehound-postgres
    environment:
      POSTGRES_DB: tracehound
      POSTGRES_USER: hound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackhound123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize database with schema
      - ../internal/storage/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hound -d tracehound"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracehound-net
    restart: unless-stopped

  # ============================================================================
  # Zookeeper - Kafka Coordination
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: tracehound-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tracehound-net
    restart: unless-stopped

  # ============================================================================
  # Kafka - Event Streaming
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tracehound-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
      KAFKA_LOG_RETENTION_BYTES: 1073741824  # 1GB
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tracehound-net
    restart: unless-stopped

  # ============================================================================
  # Kafka Topic Initialization
  # ============================================================================
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tracehound-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo '🐕 Creating Kafka topics for Tracehound...'
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic whale_scents --partitions 3 --replication-factor 1
      echo '✅ Topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - tracehound-net

  # ============================================================================
  # Tracehound Indexer
  # ============================================================================
  indexer:
    build:
      context: ..
      dockerfile: deployments/docker/Dockerfile
    container_name: tracehound-indexer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Hyperliquid WebSocket
      HYPERLIQUID_WS_URL: ${HYPERLIQUID_WS_URL:-wss://api.hyperliquid.xyz/ws}

      # PostgreSQL
      POSTGRES_URL: postgres://hound:${POSTGRES_PASSWORD:-trackhound123}@postgres:5432/tracehound?sslmode=disable

      # Kafka
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: whale_scents

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json
    networks:
      - tracehound-net
    restart: unless-stopped

# ============================================================================
# Networks
# ============================================================================
networks:
  tracehound-net:
    driver: bridge
    name: tracehound-network

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data:
    name: tracehound-postgres-data
  zookeeper_data:
    name: tracehound-zookeeper-data
  zookeeper_logs:
    name: tracehound-zookeeper-logs
  kafka_data:
    name: tracehound-kafka-data
